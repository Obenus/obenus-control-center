services:
  app:
    build:
      context: .
      dockerfile: ./deployment/Dockerfile
    container_name: obenus_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - ./obenus-nova.py:/app/obenus-nova.py:ro
      - ./agents:/app/agents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - obenus_network
    mem_limit: 512m
    memswap_limit: 1g
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: ./deployment/Dockerfile.worker
    container_name: obenus_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - ./obenus-nova.py:/app/obenus-nova.py:ro
      - ./agents:/app/agents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - obenus_network
    mem_limit: 512m
    memswap_limit: 1g

  postgres:
    image: postgres:16-alpine
    container_name: obenus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-obenus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-obenus_db}
    # Sin puerto publicado: solo red interna Docker (Plesk/proxy no necesita DB)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - obenus_network
    mem_limit: 768m
    memswap_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: obenus_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD required}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - obenus_network
    mem_limit: 128m
    memswap_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backup:
    image: postgres:16-alpine
    container_name: obenus_backup
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_USER: ${POSTGRES_USER:-obenus}
      POSTGRES_DB: ${POSTGRES_DB:-obenus_db}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./deployment/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["/bin/sh", "/backup-loop.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - obenus_network
    mem_limit: 256m
    memswap_limit: 512m

volumes:
  postgres_data:
  redis_data:

networks:
  obenus_network:
    driver: bridge
